{% extends "base.html" %} {% block content %}

<h2 dir="rtl">حضور و غیاب کلاس {{ classroom }}</h2>

<form method="post" dir="rtl">
  {% csrf_token %}

  <table class="table" dir="rtl">
    <tr>
      <th>نام دانش آموز</th>
      <th>وضعیت</th>
    </tr>

    {% for student in students %}

    <tr>
      <td>{{ student.first_name }} {{ student.last_name }}</td>

      <td>
        <label>
          <input type="radio" name="student_{{student.id}}" value="present" checked/>
          حاضر
        </label>

        <label>
          <input type="radio" name="student_{{student.id}}" value="absent" />
          غایب
        </label>
      </td>
    </tr>

    {% endfor %}
  </table>

  <button class="btn btn-primary">ثبت حضور و غیاب</button>
</form>

{% endblock %}
